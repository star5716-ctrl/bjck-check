<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>比利·简·金杯 · 下卡核验</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --primary: #C41230; --primary-dark: #8B0020; --bg: #F5F5F5; --card: #FFFFFF;
  --text: #1A1A1A; --text-secondary: #666666; --border: #E0E0E0;
  --success: #2E7D32; --success-bg: #E8F5E9; --fail: #C62828; --fail-bg: #FFEBEE;
  --gold: #D4A843;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
.header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: #fff; padding: 20px 16px 16px; text-align: center;
}
.header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.header .subtitle { font-size: 13px; opacity: 0.85; }
.header .badge {
  display: inline-block; background: var(--gold); color: #1A1A1A;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-top: 8px;
}
.container { padding: 16px; max-width: 480px; margin: 0 auto; }
.upload-card {
  background: var(--card); border-radius: 16px; padding: 20px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px;
}
.upload-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px 16px; border: 2px dashed var(--border); border-radius: 12px;
  cursor: pointer; transition: all 0.2s;
}
.upload-zone:active { border-color: var(--primary); background: #FFF0F3; }
.upload-icon { font-size: 44px; margin-bottom: 8px; }
.upload-text { font-size: 15px; font-weight: 600; }
.upload-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.preview-card {
  background: var(--card); border-radius: 16px; padding: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px;
}
.preview-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);
}
.btn-change { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; }
#previewImg { width: 100%; border-radius: 10px; max-height: 280px; object-fit: contain; }
.progress-card {
  background: var(--card); border-radius: 16px; padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px; text-align: center;
}
.progress-icon { font-size: 36px; margin-bottom: 8px; }
.progress-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.progress-bar {
  height: 6px; background: #E8E8E8; border-radius: 3px; overflow: hidden; margin-bottom: 8px;
}
.progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: var(--text-secondary); }
.result-card {
  border-radius: 16px; padding: 20px 16px; margin-bottom: 16px; display: none;
}
.result-card.pass { background: var(--success-bg); border: 1.5px solid var(--success); }
.result-card.fail { background: var(--fail-bg); border: 1.5px solid var(--fail); }
.result-icon { font-size: 36px; text-align: center; margin-bottom: 8px; }
.result-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.result-card.pass .result-title { color: var(--success); }
.result-card.fail .result-title { color: var(--fail); }
.result-details { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 12px; font-size: 13px; }
.result-details .item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.result-details .item:last-child { border-bottom: none; }
.result-details .item .k { color: var(--text-secondary); }
.result-details .item .v { font-weight: 600; }
.ocr-debug {
  background: #f0f0f0; border-radius: 8px; padding: 10px; margin-top: 12px;
  font-size: 11px; color: #666; max-height: 150px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
}
.history-section { margin-top: 8px; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.history-header h3 { font-size: 15px; font-weight: 600; }
.history-clear { font-size: 12px; color: var(--primary); background: none; border: none; cursor: pointer; }
.history-item {
  background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.history-item .hi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.history-item .hi-card { font-weight: 600; font-size: 14px; }
.history-item .hi-time { font-size: 11px; color: var(--text-secondary); }
.history-item .hi-detail { font-size: 12px; color: var(--text-secondary); }
.history-item .hi-status { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.history-item .hi-status.pass { background: var(--success-bg); color: var(--success); }
.history-item .hi-status.fail { background: var(--fail-bg); color: var(--fail); }
.footer { text-align: center; padding: 20px 16px 30px; font-size: 11px; color: #999; }
</style>
</head>
<body>

<div class="header">
  <h1> 比利·简·金杯</h1>
  <div class="subtitle">工商银行联名卡 · 下卡核验</div>
  <div class="badge">礼品领取资格 · 现场检查</div>
</div>

<div class="container">
  <div class="upload-card">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text">点击上传或拍照</div>
      <div class="upload-hint">上传客户工行APP截图，自动识别核验</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleUpload(event)" style="display:none">
  </div>

  <div class="preview-card" id="previewCard" style="display:none">
    <div class="preview-top">
      <span>📷 已上传截图</span>
      <button class="btn-change" onclick="document.getElementById('fileInput').click()">重新选择</button>
    </div>
    <img id="previewImg" src="" alt="preview">
  </div>

  <div class="progress-card" id="progressCard" style="display:none">
    <div class="progress-icon">⏳</div>
    <div class="progress-title">正在识别截图…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">初始化中</div>
  </div>

  <div class="result-card" id="resultCard"></div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="history-header">
      <h3> 核验记录</h3>
      <button class="history-clear" onclick="clearHistory()">清空记录</button>
    </div>
    <div id="historyList"></div>
  </div>

  <div class="footer">
    比利·简·金杯赛事 · 工商银行联名卡推广<br>
    现场核验工具 v6.0 · 针对工行APP截图优化
  </div>
</div>

<script>
// All Chinese strings built via String.fromCharCode to avoid encoding issues
var K = {};
K.shenQingDan = String.fromCharCode(0x7533,0x8BF7,0x5355);
K.kaiHuChengGong = String.fromCharCode(0x5F00,0x6237,0x6210,0x529F);
K.fenDou = String.fromCharCode(0x594B,0x6597);
K.wanShiDa = String.fromCharCode(0x4E07,0x4E8B,0x8FBE);
K.ouZhou = String.fromCharCode(0x6B27,0x6D32);
K.zhongGuo = String.fromCharCode(0x4E2D,0x56FD);
K.henZan = String.fromCharCode(0x5F88,0x8D5E);
K.yiWanCheng = String.fromCharCode(0x5DF2,0x5B8C,0x6210);
K.yiQiYong = String.fromCharCode(0x5DF2,0x542F,0x7528);
K.yiYouJi = String.fromCharCode(0x5DF2,0x90AE,0x5BC4);
K.yiShenPi = String.fromCharCode(0x5DF2,0x5BA1,0x6279);
K.kaiHu = String.fromCharCode(0x5F00,0x6237);
K.wanXiangXing = String.fromCharCode(0x4E07,0x8C61,0x661F);

var cardFendou = K.fenDou + K.wanShiDa + String.fromCharCode(0x7B80,0x7EA6,0x767D,0x91D1,0x5361);
var cardOuzhou = K.ouZhou + String.fromCharCode(0x65C5,0x884C,0x5361);
var cardFendouZG = K.fenDou + K.zhongGuo + K.henZan + 'M' + String.fromCharCode(0x767D,0x91D1);
var validCards = [cardFendou, cardOuzhou, cardFendouZG];

var path1Statuses = [K.kaiHuChengGong, K.yiWanCheng];
var path2Statuses = [K.yiQiYong, K.yiYouJi, K.yiShenPi];
var minDate = '2025-01-01';

var UI = {};
UI.initText = String.fromCharCode(0x521D,0x59CB,0x5316,0x4E2D,0x2026);
UI.recogText = String.fromCharCode(0x6B63,0x5728,0x8BC6,0x522B,0x2026);
UI.noResult = String.fromCharCode(0x672A,0x8BC6,0x522B,0x5230,0x6709,0x6548,0x4FE1,0x606F);
UI.totalText = String.fromCharCode(0x5171,0x8BC6,0x522B);
UI.tiao = String.fromCharCode(0x6761);
UI.jilu = String.fromCharCode(0x8BB0,0x5F55,0xFF0C);
UI.tongguo = String.fromCharCode(0x901A,0x8FC7);
UI.butongguo = String.fromCharCode(0x4E0D,0x901A,0x8FC7);
UI.douhao = String.fromCharCode(0x3001);
UI.weishibie = String.fromCharCode(0x672A,0x8BC6,0x522B);
UI.zhishibufu = String.fromCharCode(0x5361,0x79CD,0x4E0D,0x7B26,0x5408);
UI.rqweishibie = String.fromCharCode(0x65E5,0x671F,0x672A,0x8BC6,0x522B);
UI.rqbufu = String.fromCharCode(0x65E5,0x671F,0x4E0D,0x7B26,0x5408);
UI.ztweishibie = String.fromCharCode(0x72B6,0x6001,0x672A,0x8BC6,0x522B);
UI.ztbufu = String.fromCharCode(0x72B6,0x6001,0x4E0D,0x7B26,0x5408);
UI.youfuhe = String.fromCharCode(0x6709,0x7B26,0x5408,0x6761,0x4EF6,0x7684,0x8BB0,0x5F55,0xFF0C,0x53EF,0x4EE5,0x9886,0x53D6,0x793C,0x54C1);
UI.rqi = String.fromCharCode(0x65E5,0x671F);
UI.zhuangtai = String.fromCharCode(0x72B6,0x6001);
UI.lujing = String.fromCharCode(0x8DEF,0x5F84);
UI.shenqingriqi = String.fromCharCode(0x7533,0x8BF7,0x65E5,0x671F);
UI.qingkong = String.fromCharCode(0x786E,0x8BA4,0x6E05,0x7A7A,0x6240,0x6709,0x6838,0x9A8C,0x8BB0,0x5F55,0xFF1F);
UI.weizhi = String.fromCharCode(0x672A,0x77E5);

function handleUpload(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewCard').style.display = 'block';
    document.getElementById('progressCard').style.display = 'block';
    var rc = document.getElementById('resultCard');
    rc.style.display = 'none';
    rc.className = 'result-card';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressText').textContent = UI.initText;
    runOCR(e.target.result);
  };
  reader.readAsDataURL(file);
}

function runOCR(imageSrc) {
  Tesseract.recognize(imageSrc, 'chi_sim', {
    logger: function(m) {
      if (m.status === 'recognizing text') {
        var pct = Math.round(m.progress * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = UI.recogText + ' ' + pct + '%';
      } else if (m.status) {
        document.getElementById('progressText').textContent = m.status;
      }
    }
  }).then(function(result) {
    var text = result.data.text;
    console.log('=== RAW OCR ===');
    console.log(text);
    console.log('=== END ===');
    document.getElementById('progressCard').style.display = 'none';
    parseAndVerify(text);
  }).catch(function(err) {
    console.error('OCR error:', err);
    document.getElementById('progressCard').style.display = 'none';
    showResult(false, [], 'OCR\u8bc6\u522b\u5931\u8d25', true, String(err));
  });
}

function parseAndVerify(text) {
  console.log('Parsing text, length:', text.length);
  var records = [];
  var sqd = K.shenQingDan;
  var parts = text.split(sqd);
  console.log('Split into', parts.length, 'parts');

  for (var i = 1; i < parts.length; i++) {
    var part = parts[i];
    var rec = { cardName: '', applyDate: '', cardStatus: '', path: 1 };
    var lines = part.split(/\r?\n/);
    var header = lines.slice(0, 5).join('\n');

    // Card name
    if (header.indexOf(K.ouZhou) >= 0) {
      rec.cardName = cardOuzhou;
    } else if (header.indexOf(K.fenDou) >= 0 && header.indexOf(K.wanShiDa) >= 0) {
      rec.cardName = cardFendou;
    } else if (header.indexOf(K.fenDou) >= 0 && (header.indexOf(K.zhongGuo) >= 0 || header.indexOf(K.henZan) >= 0)) {
      rec.cardName = cardFendouZG;
    } else if (header.indexOf(K.fenDou) >= 0) {
      rec.cardName = cardFendou;
    } else if (header.indexOf(K.wanXiangXing) >= 0) {
      rec.cardName = K.wanXiangXing + String.fromCharCode(0x8054,0x540D,0x5361);
    }

    // Date
    for (var l = 0; l < lines.length; l++) {
      var dm = lines[l].match(/(\d{4})[-\/\u5e74](\d{1,2})[-\/\u6708](\d{1,2})/);
      if (dm && !rec.applyDate) {
        rec.applyDate = dm[1] + '-' +
          (dm[2].length < 2 ? '0' + dm[2] : dm[2]) + '-' +
          (dm[3].length < 2 ? '0' + dm[3] : dm[3]);
      }
    }

    // Status
    if (part.indexOf(K.kaiHuChengGong) >= 0) {
      rec.cardStatus = K.kaiHuChengGong; rec.path = 1;
    } else if (part.indexOf(K.yiWanCheng) >= 0) {
      rec.cardStatus = K.yiWanCheng; rec.path = 1;
    } else if (part.indexOf(K.yiQiYong) >= 0) {
      rec.cardStatus = K.yiQiYong; rec.path = 2;
    } else if (part.indexOf(K.yiYouJi) >= 0) {
      rec.cardStatus = K.yiYouJi; rec.path = 2;
    } else if (part.indexOf(K.yiShenPi) >= 0) {
      rec.cardStatus = K.yiShenPi; rec.path = 2;
    } else if (part.indexOf(K.kaiHu) >= 0) {
      rec.cardStatus = K.kaiHuChengGong; rec.path = 1;
    }

    if (rec.cardName || rec.applyDate || rec.cardStatus) {
      records.push(rec);
      console.log('Record', i, ':', JSON.stringify(rec));
    }
  }

  console.log('Total records:', records.length);

  if (records.length === 0) {
    showResult(false, [], UI.noResult, true, text);
    return;
  }

  var results = [];
  for (var r = 0; r < records.length; r++) {
    var rec = records[r];
    var pass = true;
    var reasons = [];

    if (!rec.cardName || validCards.indexOf(rec.cardName) === -1) {
      pass = false;
      reasons.push(UI.zhishibufu + '(' + (rec.cardName || UI.weishibie) + ')');
    }
    if (!rec.applyDate) {
      pass = false;
      reasons.push(UI.rqweishibie);
    } else if (rec.applyDate < minDate) {
      pass = false;
      reasons.push(UI.rqbufu);
    }
    if (!rec.cardStatus) {
      pass = false;
      reasons.push(UI.ztweishibie);
    } else {
      var expected = rec.path === 1 ? path1Statuses : path2Statuses;
      if (expected.indexOf(rec.cardStatus) === -1) {
        pass = false;
        reasons.push(UI.ztbufu);
      }
    }

    results.push({
      cardName: rec.cardName || UI.weishibie,
      pass: pass,
      reason: reasons.join(UI.douhao),
      date: rec.applyDate || '-',
      status: rec.cardStatus || '-'
    });

    saveHistory(pass, rec.cardName || UI.weizhi, rec.path, rec.applyDate || '-', rec.cardStatus || '-');
  }

  var hasAnyPass = results.some(function(x) { return x.pass; });
  showResult(hasAnyPass, results, null, !hasAnyPass, text);
}

function showResult(hasPass, results, errorMsg, showDebug, rawText) {
  var card = document.getElementById('resultCard');
  card.className = 'result-card show ' + (hasPass ? 'pass' : 'fail');
  card.style.display = 'block';

  var html = '';

  if (errorMsg) {
    html += '<div class="result-icon">\u26a0\ufe0f</div>';
    html += '<div class="result-title">' + errorMsg + '</div>';
  } else {
    var totalPass = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i].pass) totalPass++;
    }
    var totalFail = results.length - totalPass;

    html += '<div class="result-icon">' + (hasPass ? '\u2705' : '\u274c') + '</div>';
    html += '<div class="result-title">' + UI.totalText + ' ' + results.length + ' ' + UI.tiao + UI.jilu + totalPass + ' ' + UI.tiao + UI.tongguo + UI.douhao + totalFail + ' ' + UI.tiao + UI.butongguo;
    if (hasPass) {
      html += ' \u2014 ' + UI.youfuhe + ' \ud83c\udf81';
    }
    html += '</div>';
    html += '<div class="result-details">';

    for (var j = 0; j < results.length; j++) {
      var r = results[j];
      var icon = r.pass ? '\u2705' : '';
      var color = r.pass ? 'var(--success)' : 'var(--fail)';
      var label = r.pass ? UI.tongguo : UI.butongguo;
      html += '<div style="padding:10px 0;border-bottom:1px dashed var(--border);">';
      html += '<div style="font-weight:600;margin-bottom:4px;">' + icon + ' ' + r.cardName + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary);">' + UI.rqi + ': ' + r.date + ' | ' + UI.zhuangtai + ': ' + r.status + '</div>';
      html += '<div style="font-size:13px;font-weight:600;margin-top:4px;color:' + color + ';">' + label;
      if (!r.pass && r.reason) {
        html += ' \u2014 ' + r.reason;
      }
      html += '</div></div>';
    }
    html += '</div>';
  }

  if (showDebug && rawText) {
    html += '<div class="ocr-debug"><strong>OCR\u8bc6\u522b\u539f\u6587\uff1a</strong>\n' + escapeHtml(rawText.substring(0, 800)) + '</div>';
  }

  card.innerHTML = html;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}

function saveHistory(pass, cardName, path, date, status) {
  try {
    var history = JSON.parse(localStorage.getItem('bjck_history') || '[]');
    var now = new Date();
    var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
      String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    history.unshift({ time: timeStr, pass: pass, cardName: cardName, path: path, date: date, status: status });
    if (history.length > 50) history.length = 50;
    localStorage.setItem('bjck_history', JSON.stringify(history));
    renderHistory();
  } catch(e) {}
}

function renderHistory() {
  try {
    var history = JSON.parse(localStorage.getItem('bjck_history') || '[]');
    var section = document.getElementById('historySection');
    var list = document.getElementById('historyList');
    if (history.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    var html = '';
    for (var i = 0; i < history.length; i++) {
      var h = history[i];
      html += '<div class="history-item">' +
        '<div class="hi-top"><span class="hi-card">' + h.cardName + '</span>' +
        '<span class="hi-status ' + (h.pass ? 'pass' : 'fail') + '">' + (h.pass ? UI.tongguo : UI.butongguo) + '</span></div>' +
        '<div class="hi-detail">' + UI.lujing + h.path + ' \u00b7 ' + UI.shenqingriqi + ' ' + h.date + ' \u00b7 ' + UI.zhuangtai + ' ' + h.status + '</div>' +
        '<div class="hi-time">' + h.time + '</div></div>';
    }
    list.innerHTML = html;
  } catch(e) {}
}

function clearHistory() {
  if (confirm(UI.qingkong)) {
    localStorage.removeItem('bjck_history');
    renderHistory();
  }
}

renderHistory();
</script>
</body>
</html>
