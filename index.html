<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>工银万事达信用卡 · 下卡核验</title>
<style>
:root{--primary:#C41230;--primary-dark:#8B0020;--bg:#F5F5F5;--card:#FFF;--text:#1A1A1A;--text2:#666;--border:#E0E0E0;--success:#2E7D32;--success-bg:#E8F5E9;--fail:#C62828;--fail-bg:#FFEBEE;--gold:#D4A843}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:20px 16px 16px;text-align:center}
.header h1{font-size:19px;font-weight:600;margin-bottom:4px}
.header .subtitle{font-size:13px;opacity:.85}
.header .badge{display:inline-block;background:var(--gold);color:#1A1A1A;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:8px}
.container{padding:16px;max-width:480px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:20px 16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
.photo-btn{width:100%;padding:16px;background:var(--card);border:2px dashed var(--border);border-radius:12px;cursor:pointer;text-align:center;font-size:14px;color:var(--text2);margin-bottom:10px}
.photo-btn:active{border-color:var(--primary);background:#FFF0F3}
.photo-btn.done{border-style:solid;border-color:var(--success);background:var(--success-bg);color:var(--success)}
#fileInput{display:none}
.preview-wrap{display:none}
.preview-img{width:100%;border-radius:10px;max-height:200px;object-fit:contain}
.photo-actions{display:flex;gap:8px;margin-top:8px}
.photo-actions button{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;color:var(--text2);cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text2)}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(196,18,48,.15)}
.btn-verify{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.btn-verify:active{opacity:.85}
.btn-reset{width:100%;padding:12px;background:none;color:var(--text2);border:1px solid var(--border);border-radius:12px;font-size:14px;cursor:pointer;margin-top:8px}
.btn-reset:active{background:#f5f5f5}
.result-card{border-radius:16px;padding:28px 16px;margin-bottom:16px;display:none;text-align:center}
.result-card.pass{background:var(--success-bg);border:1.5px solid var(--success)}
.result-card.fail{background:var(--fail-bg);border:1.5px solid var(--fail)}
.result-icon{font-size:56px;margin-bottom:8px}
.result-title{font-size:26px;font-weight:700}
.result-card.pass .result-title{color:var(--success)}
.result-card.fail .result-title{color:var(--fail)}
.result-reasons{margin-top:10px;font-size:14px;color:var(--text2);line-height:1.6}
.hi{background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.hi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hi-name{font-weight:600;font-size:14px}
.hi-status{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.hi-status.pass{background:var(--success-bg);color:var(--success)}
.hi-status.fail{background:var(--fail-bg);color:var(--fail)}
.hi-detail{font-size:12px;color:var(--text2);line-height:1.6}
.hi-time{font-size:11px;color:var(--text2);margin-top:4px}
.hi-thumb{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:8px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.history-header h3{font-size:15px;font-weight:600}
.btn-clear{font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer}
.footer{text-align:center;padding:20px 16px 30px;font-size:11px;color:#999}
</style>
</head>
<body>
<div class="header">
  <h1>&#x1f3c6; 比利·简·金杯</h1>
  <div class="subtitle">工银万事达信用卡 · 下卡核验</div>
  <div class="badge">礼品领取资格 · 现场检查</div>
</div>
<div class="container">

  <div class="card">
    <div class="photo-btn" id="photoBtn" onclick="document.getElementById('fileInput').click()">
      &#x1f4f7; 拍照/选图（可选，绑定本次核验）
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handlePhoto(event)">
    <div class="preview-wrap" id="previewWrap">
      <img class="preview-img" id="previewImg">
      <div class="photo-actions">
        <button onclick="document.getElementById('fileInput').click()">&#x1f4f7; 重选</button>
        <button onclick="removePhoto()">删除</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>申请单号</label>
      <input type="text" id="applyNo" placeholder="如：02002025057700521">
    </div>
    <div class="form-group">
      <label>卡种</label>
      <select id="cardType">
        <option value="">请选择卡种</option>
        <option value="&#x594b;&#x6597;&#x4e07;&#x4e8b;&#x8fbe;&#x7b80;&#x7ea6;&#x767d;&#x91d1;&#x5361;">&#x594b;&#x6597;&#x4e07;&#x4e8b;&#x8fbe;&#x7b80;&#x7ea6;&#x767d;&#x91d1;&#x5361;</option>
        <option value="&#x6b27;&#x6d32;&#x65c5;&#x884c;&#x5361;">&#x6b27;&#x6d32;&#x65c5;&#x884c;&#x5361;</option>
        <option value="&#x594b;&#x6597;&#x4e2d;&#x56fd;&#x5f88;&#x8d5e;&#x202f;&#x202f;&#x767d;&#x91d1;">&#x594b;&#x6597;&#x4e2d;&#x56fd;&#x5f88;&#x8d5e;&#x202f;&#x202f;&#x767d;&#x91d1;</option>
      </select>
    </div>
    <div class="form-group">
      <label>申请日期</label>
      <input type="date" id="applyDate">
    </div>
    <div class="form-group">
      <label>卡状态</label>
      <select id="cardStatus">
        <option value="">请选择状态</option>
        <option value="&#x5f00;&#x6237;&#x6210;&#x529f;">&#x5f00;&#x6237;&#x6210;&#x529f;</option>
        <option value="&#x5df2;&#x5b8c;&#x6210;">&#x5df2;&#x5b8c;&#x6210;</option>
        <option value="&#x5df2;&#x542f;&#x7528;">&#x5df2;&#x542f;&#x7528;</option>
        <option value="&#x5df2;&#x90ae;&#x5bc4;">&#x5df2;&#x90ae;&#x5bc4;</option>
        <option value="&#x5df2;&#x5ba1;&#x6279;">&#x5df2;&#x5ba1;&#x6279;</option>
      </select>
    </div>
    <button class="btn-verify" onclick="doVerify()">&#x2705; 核验</button>
    <button class="btn-reset" onclick="doReset()">清空表单</button>
  </div>

  <div class="result-card" id="resultCard"></div>

  <div id="historySection" style="display:none">
    <div class="history-header">
      <h3>&#x1f4cb; 核验记录</h3>
      <button class="btn-clear" onclick="clearHistory()">清空记录</button>
    </div>
    <div id="historyList"></div>
  </div>

  <div class="footer">比利·简·金杯赛事 · 工银万事达信用卡推广<br>现场核验工具 v12.0</div>
</div>

<script>
var minDate='2026-09-01';

function handlePhoto(e){
  var f=e.target.files[0];
  if(!f)return;
  compressImage(f,400,function(base64){
    document.getElementById('previewImg').src=base64;
    document.getElementById('previewWrap').style.display='block';
    var btn=document.getElementById('photoBtn');
    btn.className='photo-btn done';
    btn.textContent='\u2705 已选图（绑定本次核验）';
  });
}

function compressImage(file,maxW,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var r=1;
      if(img.width>maxW)r=maxW/img.width;
      canvas.width=img.width*r;
      canvas.height=img.height*r;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto(){
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('previewImg').src='';
  document.getElementById('fileInput').value='';
  var btn=document.getElementById('photoBtn');
  btn.className='photo-btn';
  btn.textContent='\u{1f4f7} 拍照/选图（可选，绑定本次核验）';
}

function doVerify(){
  var applyNo=document.getElementById('applyNo').value.trim();
  var cardType=document.getElementById('cardType').value;
  var applyDate=document.getElementById('applyDate').value;
  var cardStatus=document.getElementById('cardStatus').value;

  if(!cardType&&!applyDate&&!cardStatus){
    showResult(false,'\u4e0d\u901a\u8fc7','\u8bf7\u81f3\u5c11\u586b\u5199\u5361\u79cd\u3001\u7533\u8bf7\u65e5\u671f\u3001\u5361\u72b6\u6001');
    return;
  }

  var pass=true;
  var reasons=[];

  var validCards=['\u594b\u6597\u4e07\u4e8b\u8fbe\u7b80\u7ea6\u767d\u91d1\u5361','\u6b27\u6d32\u65c5\u884c\u5361','\u594b\u6597\u4e2d\u56fd\u5f88\u8d5e\u202f\u202f\u767d\u91d1'];
  if(!cardType){pass=false;reasons.push('\u672a\u9009\u62e9\u5361\u79cd');}
  else if(validCards.indexOf(cardType)===-1){pass=false;reasons.push('\u5361\u79cd\u4e0d\u5728\u8ba4\u53ef\u8303\u56f4\u5185('+cardType+')');}

  if(!applyDate){pass=false;reasons.push('\u672a\u586b\u5199\u7533\u8bf7\u65e5\u671f');}
  else if(applyDate<minDate){pass=false;reasons.push('\u7533\u8bf7\u65e5\u671f\u65e9\u4e8e '+minDate);}

  var allStatus=['\u5f00\u6237\u6210\u529f','\u5df2\u5b8c\u6210','\u5df2\u542f\u7528','\u5df2\u90ae\u5bc4','\u5df2\u5ba1\u6279'];
  if(!cardStatus){pass=false;reasons.push('\u672a\u9009\u62e9\u5361\u72b6\u6001');}
  else if(allStatus.indexOf(cardStatus)===-1){pass=false;reasons.push('\u5361\u72b6\u6001\u4e0d\u7b26\u5408('+cardStatus+')');}

  var photo=document.getElementById('previewWrap').style.display!=='none'?document.getElementById('previewImg').src:'';

  var record={
    cardName:cardType||'\u672a\u9009\u62e9',
    applyNo:applyNo||'-',
    date:applyDate||'-',
    status:cardStatus||'-',
    pass:pass,
    reasons:reasons.join('\uff1b'),
    photo:photo,
    time:Date.now()
  };

  saveRecord(record);

  if(pass){showResult(true,'\u901a\u8fc7','');}
  else{showResult(false,'\u4e0d\u901a\u8fc7',record.reasons);}

  doReset();
}

function showResult(pass,title,reason){
  var c=document.getElementById('resultCard');
  c.className='result-card '+(pass?'pass':'fail');
  c.style.display='block';
  var h='<div class="result-icon">'+(pass?'\u2705':'\u274c')+'</div>';
  h+='<div class="result-title">'+title+'</div>';
  if(reason)h+='<div class="result-reasons">'+reason+'</div>';
  c.innerHTML=h;
  c.scrollIntoView({behavior:'smooth',block:'center'});
}

function doReset(){
  document.getElementById('applyNo').value='';
  document.getElementById('cardType').value='';
  document.getElementById('applyDate').value='';
  document.getElementById('cardStatus').value='';
  document.getElementById('resultCard').style.display='none';
  removePhoto();
}

function saveRecord(r){
  try{
    var h=JSON.parse(localStorage.getItem('bjck_v12')||'[]');
    var n=new Date();
    var ts=n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate())
      +' '+p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
    h.unshift({time:ts,timeMs:r.time,pass:r.pass,cardName:r.cardName,date:r.date,status:r.status,applyNo:r.applyNo,photo:r.photo,reasons:r.reasons});
    if(h.length>100)h.length=100;
    localStorage.setItem('bjck_v12',JSON.stringify(h));
    renderHistory();
  }catch(e){}
}

function p2(n){return n<10?'0'+n:''+n;}

function renderHistory(){
  try{
    var h=JSON.parse(localStorage.getItem('bjck_v12')||'[]');
    var s=document.getElementById('historySection');
    var l=document.getElementById('historyList');
    if(!h.length){s.style.display='none';return;}
    s.style.display='block';
    var html='';
    for(var i=0;i<h.length;i++){
      var x=h[i];
      html+='<div class="hi">'
        +'<div class="hi-top">'
        +'<span class="hi-name">'+esc(x.cardName)+'</span>'
        +'<span class="hi-status '+(x.pass?'pass':'fail')+'">'+(x.pass?'\u901a\u8fc7':'\u4e0d\u901a\u8fc7')+'</span>'
        +'</div>'
        +'<div class="hi-detail">\u5355\u53f7 '+esc(x.applyNo)+' \u00b7 \u65e5\u671f '+esc(x.date)+' \u00b7 \u72b6\u6001 '+esc(x.status)+'</div>';
      if(x.reasons)html+='<div class="hi-detail" style="color:var(--fail)">'+esc(x.reasons)+'</div>';
      if(x.photo)html+='<img class="hi-thumb" src="'+x.photo+'">';
      html+='<div class="hi-time">'+esc(x.time)+'</div></div>';
    }
    l.innerHTML=html;
  }catch(e){}
}

function esc(t){var d=document.createElement('div');d.appendChild(document.createTextNode(t));return d.innerHTML;}

function clearHistory(){
  if(confirm('\u786e\u8ba4\u6e05\u7a7a\u6240\u6709\u6838\u9a8c\u8bb0\u5f55\uff1f')){
    localStorage.removeItem('bjck_v12');
    renderHistory();
  }
}

renderHistory();
</script>
</body>
</html>
